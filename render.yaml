# Render Blueprint — RTGS FastAPI backend (configure secrets in Render dashboard; never commit values)
services:
  - type: web
    name: rtgs-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTH_DEV_BYPASS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_AUDIENCE
        value: authenticated
      - key: JWT_ISSUER
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_MODE
        value: rules
